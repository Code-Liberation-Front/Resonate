<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Resonate logo">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#262833"/>
      <stop offset="100%" stop-color="#14151a"/>
    </radialGradient>
    <linearGradient id="tri" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7059"/>
      <stop offset="100%" stop-color="#EF2D54"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D4D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF4D4D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="150" fill="url(#glow)" opacity="0.22"/>

  <!-- resonance ripples -->
  <path d="M 378.9 170 A 150 150 0 0 1 378.9 342" fill="none" stroke="#FF5450" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  <path d="M 425.5 165.9 A 192 192 0 0 1 425.5 346.1" fill="none" stroke="#FF9C8A" stroke-width="13" stroke-linecap="round" opacity="0.55"/>
  <path d="M 133.1 170 A 150 150 0 0 0 133.1 342" fill="none" stroke="#FF5450" stroke-width="18" stroke-linecap="round" opacity="0.95"/>
  <path d="M 86.5 165.9 A 192 192 0 0 0 86.5 346.1" fill="none" stroke="#FF9C8A" stroke-width="13" stroke-linecap="round" opacity="0.55"/>

  <!-- play triangle -->
  <path d="M 224 192 L 338 256 L 224 320 Z" fill="url(#tri)" stroke="url(#tri)" stroke-width="30" stroke-linejoin="round"/>
</svg>
